<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pivo Apps</title>
<meta name="description" content="Apps simples, gratuitos, sem conta e sem anúncios.">
<style>
  :root { --bg:#f6f8f2; --ink:#1d372d; --muted:#5f7568; --green:#20684c; --card:#fff; --line:#dfe8dd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111a16; --ink:#e4efe7; --muted:#a3b8ab; --green:#7fd1a8; --card:#18241f; --line:#2a3a33; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:40px 16px 64px; }
  h1 { font-size:clamp(30px,7vw,44px); margin:0 0 8px; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin:24px 0; }
  h2 { margin:0 0 4px; font-size:22px; }
  a { color:var(--green); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Pivo Apps</h1>
  <p class="muted">Apps simples e gratuitos. Sem conta, sem anúncios, sem rastreamento.</p>
  <div class="card">
    <h2>Intervalo</h2>
    <p class="muted">Treino intervalado de caminhada e corrida por tempo ou distância, com avisos por voz e vibração.</p>
    <p><a href="intervalo/privacidade/">Política de privacidade</a></p>
  </div>
</main>
</body>
</html>
